# Full ToCloud9 product release (Go services only).
# libsidecar-cpp is completely separate: tag libsidecar-v* → release-libsidecar.yml
#
# Note: tag filter 'v*' does not match 'libsidecar-v*' (prefix is different).

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    name: go-services-${{ matrix.goos }}-${{ matrix.goarch }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build all services
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p binaries configs

          SERVICES="authserver auctionhouse charserver chatserver gateway groupserver guidserver guildserver mailserver matchmakingserver mysqlreverseproxy perun servers-registry"

          for SERVICE in $SERVICES; do
            echo "Building $SERVICE..."

            # Set binary name
            BINARY_NAME="${SERVICE}"
            if [ "${{ matrix.goos }}" = "windows" ]; then
              BINARY_NAME="${SERVICE}.exe"
            fi

            # Check if service has its own go.mod (separate module like perun)
            if [ -f "apps/${SERVICE}/go.mod" ]; then
              echo "  Separate module detected, building in apps/${SERVICE}"
              (
                cd "apps/${SERVICE}"
                go build -v -trimpath \
                  -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
                  -o "../../binaries/${BINARY_NAME}" \
                  "./cmd/${SERVICE}"
              )
            else
              # Find main.go in main module
              if [ -f "apps/${SERVICE}/cmd/${SERVICE}/main.go" ]; then
                BUILD_PATH="./apps/${SERVICE}/cmd/${SERVICE}"
              elif [ -f "apps/${SERVICE}/main.go" ]; then
                BUILD_PATH="./apps/${SERVICE}"
              else
                echo "WARNING: Could not find main.go for ${SERVICE}, skipping"
                continue
              fi

              # Build
              go build -v -trimpath \
                -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
                -o "binaries/${BINARY_NAME}" \
                "${BUILD_PATH}"
            fi

          done

      - name: Create package
        run: |
          mkdir -p package/bin

          # Copy binaries
          cp binaries/* package/bin/ 2>/dev/null || true

          # Copy root config.yml.example as config.yml into bin folder
          if [ -f "config.yml.example" ]; then
            cp config.yml.example package/bin/config.yml
          fi

          # Create README
          cat > package/README.txt << 'EOF'
          ToCloud9 Services - ${{ matrix.goos }}/${{ matrix.goarch }}

          Version: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Build: Statically linked (CGO_ENABLED=0)

          Directory Structure:
          - bin/           - All service executables and config.yml
          - README.txt     - This file

          Services Included:
          - authserver
          - charserver
          - chatserver
          - gateway
          - groupserver
          - guidserver
          - guildserver
          - mailserver
          - matchmakingserver
          - mysqlreverseproxy
          - perun
          - servers-registry

          Installation:
          1. Extract archive
          2. Make executables (Linux/macOS): chmod +x bin/*
          3. Edit bin/config.yml for your environment
          4. Run service: ./bin/<service>

          All binaries have no runtime dependencies and can run standalone.
          EOF

          # Create archive
          ARCHIVE_NAME="tocloud9-services-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd package
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "../${ARCHIVE_NAME}.zip" .
          else
            tar -czf "../${ARCHIVE_NAME}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tocloud9-services-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tocloud9-services-*

  create-release:
    needs: [build-go-services]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

          {
            echo "## ToCloud9 Release ${{ github.ref_name }}"
            echo ""
            echo "Go services only. **libsidecar-cpp** is released separately under tags"
            echo "\`libsidecar-v*\` (workflow: Release libsidecar-cpp)."
            echo ""
            echo "### Go Services (Bundled per Platform)"
            echo ""
            for f in release-assets/tocloud9-services-*; do
              [ -e "$f" ] || continue
              echo "- \`$(basename "$f")\`"
            done
            echo ""
            echo "**Each archive includes:** binaries under \`bin/\` and a README."
            echo ""
            echo "All Go binaries are statically linked (\`CGO_ENABLED=0\`) with no dependencies."
            echo ""
            echo "### libsidecar-cpp"
            echo ""
            echo "Not included in this release. Download from a"
            echo "[libsidecar release](https://github.com/walkline/ToCloud9/releases?q=libsidecar)"
            echo "(tag \`libsidecar-vX.Y.Z\`)."
          } > release-body.md
          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
