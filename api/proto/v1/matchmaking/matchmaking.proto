syntax = "proto3";
package v1;

option go_package = "gen/matchmaking/pb";

service MatchmakingService {
  rpc EnqueueToBattleground(EnqueueToBattlegroundRequest) returns (EnqueueToBattlegroundResponse);
  rpc RemovePlayerFromQueue(RemovePlayerFromQueueRequest) returns (RemovePlayerFromQueueResponse);

  rpc BattlegroundQueueDataForPlayer(BattlegroundQueueDataForPlayerRequest) returns (BattlegroundQueueDataForPlayerResponse);

  rpc PlayerLeftBattleground(PlayerLeftBattlegroundRequest) returns (PlayerLeftBattlegroundResponse);
  rpc PlayerJoinedBattleground(PlayerJoinedBattlegroundRequest) returns (PlayerJoinedBattlegroundResponse);
  rpc BattlegroundStatusChanged(BattlegroundStatusChangedRequest) returns (BattlegroundStatusChangedResponse);

  // Dungeon finder is deliberately ephemeral. Gateways retain queue intent
  // and replay JoinLFG with the original queuedAtUnixMilli when this service's
  // instanceID changes after a restart.
  rpc JoinLFG(JoinLFGRequest) returns (JoinLFGResponse);
  rpc LeaveLFG(LeaveLFGRequest) returns (LeaveLFGResponse);
  rpc GetLFGStatus(GetLFGStatusRequest) returns (GetLFGStatusResponse);
}

enum PVPTeamID {
  Any = 0;
  Alliance = 1;
  Horde = 2;
}

enum PlayerQueueStatus {
  NotInQueue = 0;
  InQueue = 1;
  Invited = 2;
  InProgress = 3;
}

message EnqueueToBattlegroundRequest {
  string api = 1;
  uint32 realmID = 2;

  uint64 leaderGUID = 3;
  repeated uint64 partyMembers = 4;

  uint32 leadersLvl = 5;

  uint32 bgTypeID = 6;
  PVPTeamID teamID = 7;
  int64 queuedAtUnixMilli = 8;
}

message EnqueueToBattlegroundResponse {
  string api = 1;
  string instanceID = 2;
}

message RemovePlayerFromQueueRequest {
  string api = 1;

  uint32 realmID = 2;
  uint64 playerGUID = 3;
  uint32 battlegroundType = 4;
}

message RemovePlayerFromQueueResponse {
  string api = 1;
}

message BattlegroundQueueDataForPlayerRequest {
  string api = 1;

  uint32 realmID = 2;
  uint64 playerGUID = 3;
}

message BattlegroundQueueDataForPlayerResponse {
  string api = 1;

  message AssignedBattlegroundData {
    uint32 assignedBattlegroundInstanceID = 1;
    uint32 mapID = 2;
    uint32 battlegroupID = 3;
    string gameserverAddress = 4;
    string gameserverGRPCAddress = 5;
  }

  message QueueSlot {
    uint32 bgTypeID = 1;
    PlayerQueueStatus status = 2;
    optional AssignedBattlegroundData assignedBattlegroundData = 3;
  };

  repeated QueueSlot slots = 2;
}

message PlayerLeftBattlegroundRequest {
  string api = 1;

  uint32 realmID = 2;
  uint64 playerGUID = 3;
  uint32 instanceID = 4;
  bool   isCrossRealm = 5;
}

message PlayerLeftBattlegroundResponse {
  string api = 1;
}

message PlayerJoinedBattlegroundRequest {
  string api = 1;

  uint32 realmID = 2;
  uint64 playerGUID = 3;
  uint32 instanceID = 4;
  bool   isCrossRealm = 5;
}

message PlayerJoinedBattlegroundResponse {
  string api = 1;
}

message BattlegroundStatusChangedRequest {
  string api = 1;

  uint32 realmID = 2;
  uint32 instanceID = 3;
  bool   isCrossRealm = 4;

  // Use the same statuses as in gameserver (AC/TC)
  enum Status {
    None       = 0; // unused
    WaitQueue  = 1; // unused
    WaitJoin   = 2; // unused
    InProgress = 3;
    Ended      = 4;
  }
  Status status = 5;
}

message BattlegroundStatusChangedResponse {
  string api = 1;
}

enum LFGRole {
  LFGRoleNone = 0;
  LFGRoleTank = 1;
  LFGRoleHealer = 2;
  LFGRoleDamage = 4;
}

enum LFGQueueStatus {
  LFGQueueStatusNone = 0;
  LFGQueueStatusQueued = 1;
  LFGQueueStatusProposed = 2;
}

message LFGMember {
  uint32 realmID = 1;
  uint64 playerGUID = 2;
  uint32 roles = 3;
  uint32 level = 4;
  uint32 classID = 5;

  // This is the authoritative result of the world-server eligibility check,
  // including level, difficulty, expansion, attunement/quest, equipment,
  // lockout, deserter and other core rules. Matchmaking never broadens it.
  repeated uint32 eligibleDungeonIDs = 6;
}

message JoinLFGRequest {
  string api = 1;
  string requestID = 2;
  uint32 battlegroupID = 3;
  uint64 leaderGUID = 4;
  repeated LFGMember members = 5;
  repeated uint32 selectedDungeonIDs = 6;
  int64 queuedAtUnixMilli = 7;
}

message JoinLFGResponse {
  string api = 1;
  string instanceID = 2;
  LFGQueueStatus status = 3;
  uint64 proposalID = 4;
}

message LeaveLFGRequest {
  string api = 1;
  uint32 realmID = 2;
  uint64 playerGUID = 3;
}

message LeaveLFGResponse {
  string api = 1;
  string instanceID = 2;
}

message GetLFGStatusRequest {
  string api = 1;
  uint32 realmID = 2;
  uint64 playerGUID = 3;
}

message GetLFGStatusResponse {
  string api = 1;
  string instanceID = 2;
  LFGQueueStatus status = 3;
  int64 queuedAtUnixMilli = 4;
  uint64 proposalID = 5;
  uint32 dungeonID = 6;
  LFGRole assignedRole = 7;
}
